# Cairn sur le VPS.
#
# Sur antoine-vps, le Caddy partagé (antoinequarroz-caddy) occupe les ports 80 et 443 : Cairn passe
# par lui, via un docker-compose.override.yml local (voir docs/DEPLOIEMENT.md, étapes 2 et 3).
# Le VPS n'a que 2 Go de RAM : un seul build à la fois (voir docs/DEPLOIEMENT.md, étape 6).
#
#   cd deploy && docker compose up -d --build
#
# Sur un serveur sans autre Caddy, lance aussi celui fourni ici :
#
#   cd deploy && docker compose --profile caddy up -d --build

services:
  cairn:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_DIR: /data
      TZ: Europe/Zurich
    volumes:
      - cairn-data:/data
    ports:
      - "${CAIRN_BIND:-172.17.0.1}:${CAIRN_PORT:-3020}:3000"
    # Pour joindre Hermes, qui tourne directement sur le VPS (bouton « IA », voir docs/IA.md)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    profiles: ["caddy"]
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CAIRN_DOMAIN: ${CAIRN_DOMAIN:-cairn.postmelo.ch}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - cairn

volumes:
  cairn-data:
  caddy-data:
  caddy-config:
